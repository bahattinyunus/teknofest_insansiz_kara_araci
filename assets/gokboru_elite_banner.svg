<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
        <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
    <filter id="glow-text" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
        <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" />
  <rect width="1200" height="300" fill="url(#grid)" />

  <!-- Abstract Tech Elements -->
  <!-- Left Side Accents -->
  <g opacity="0.6">
    <path d="M0,50 L200,50 L250,100 L0,100 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <path d="M0,120 L180,120 L220,160 L0,160 Z" fill="#0F172A" stroke="#818CF8" stroke-width="2" />
    <circle cx="200" cy="50" r="4" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="250" cy="100" r="4" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="180" cy="120" r="4" fill="#818CF8" filter="url(#glow)"/>
    <circle cx="220" cy="160" r="4" fill="#818CF8" filter="url(#glow)"/>
  </g>

  <!-- Right Side Cyber Lines -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.5" fill="none">
    <path d="M1000,0 L1100,100 L1200,100" />
    <path d="M1050,0 L1150,100 L1200,100" />
    <path d="M950,300 L1050,200 L1200,200" />
    <path d="M850,300 L950,200 L1200,200" />
    <circle cx="1100" cy="100" r="3" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="1150" cy="100" r="3" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="1050" cy="200" r="3" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="950" cy="200" r="3" fill="#38BDF8" filter="url(#glow)"/>
  </g>

  <!-- Center Radar / Target Graphic -->
  <g transform="translate(1000, 150)" opacity="0.25">
    <circle cx="0" cy="0" r="80" stroke="#38BDF8" stroke-width="2" fill="none" />
    <circle cx="0" cy="0" r="50" stroke="#818CF8" stroke-width="1.5" fill="none" stroke-dasharray="8 4" />
    <circle cx="0" cy="0" r="20" stroke="#38BDF8" stroke-width="1" fill="#38BDF8" fill-opacity="0.2" />
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#38BDF8" stroke-width="1" />
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#38BDF8" stroke-width="1" />
    <path d="M0,0 L56,-56" stroke="#38BDF8" stroke-width="2" />
    <circle cx="56" cy="-56" r="4" fill="#38BDF8" filter="url(#glow)"/>
  </g>

  <!-- Hexagons -->
  <g transform="translate(150, 200)" stroke="#818CF8" stroke-width="2" fill="none" opacity="0.5">
    <polygon points="30,0 60,17 60,52 30,69 0,52 0,17" />
    <polygon points="90,35 120,52 120,87 90,104 60,87 60,52" />
    <polygon points="120,0 150,17 150,52 120,69 90,52 90,17" opacity="0.5"/>
  </g>

  <!-- Text Overlay -->
  <g transform="translate(420, 130)">
    <!-- Main Title -->
    <text x="180" y="0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" fill="url(#text-grad)" filter="url(#glow-text)" text-anchor="middle" letter-spacing="6">
      GÖKBÖRÜ SOTM
    </text>
    
    <!-- Subtitle -->
    <text x="180" y="45" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="22" fill="#94A3B8" text-anchor="middle" letter-spacing="4">
      TEKNOFEST İNSANSIZ KARA ARACI • 2026
    </text>

    <!-- Tags -->
    <g transform="translate(-100, 90)">
      <rect x="0" y="0" width="160" height="32" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
      <text x="80" y="21" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#38BDF8" text-anchor="middle">OTONOM SÜRÜŞ</text>
      
      <rect x="180" y="0" width="200" height="32" rx="4" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" />
      <text x="280" y="21" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#818CF8" text-anchor="middle">TAKTİK İSTİHBARAT</text>
      
      <rect x="400" y="0" width="160" height="32" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
      <text x="480" y="21" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#38BDF8" text-anchor="middle">YAPAY ZEKA</text>
    </g>
  </g>

  <!-- Border and framing -->
  <rect x="15" y="15" width="1170" height="270" fill="none" stroke="#334155" stroke-width="1" />
  <path d="M10,50 L10,10 L50,10" fill="none" stroke="#38BDF8" stroke-width="4" filter="url(#glow)" />
  <path d="M1150,10 L1190,10 L1190,50" fill="none" stroke="#38BDF8" stroke-width="4" filter="url(#glow)" />
  <path d="M10,250 L10,290 L50,290" fill="none" stroke="#818CF8" stroke-width="4" filter="url(#glow)" />
  <path d="M1150,290 L1190,290 L1190,250" fill="none" stroke="#818CF8" stroke-width="4" filter="url(#glow)" />

</svg>
